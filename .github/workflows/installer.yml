name: Check public installer
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh
      - run: shellcheck install.sh
      - run: python3 -m unittest discover -s tests -v
